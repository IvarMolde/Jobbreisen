<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Aktivitetsplanen med mål og fire statuskolonner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe8ef"/>
      <stop offset="100%" stop-color="#c5d4e0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="40" y="28" width="880" height="484" rx="18" fill="#f4f7fa" stroke="#1b3a4b" stroke-width="3"/>
  <rect x="40" y="28" width="880" height="64" rx="18" fill="#003057"/>
  <rect x="40" y="76" width="880" height="16" fill="#003057"/>
  <text x="70" y="70" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Aktivitetsplanen</text>
  <rect x="700" y="44" width="190" height="32" rx="8" fill="#EE9B00"/>
  <text x="795" y="66" text-anchor="middle" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">ØVING · ikke ekte NAV</text>

  <rect x="64" y="112" width="832" height="72" rx="12" fill="#fff" stroke="#7aa8bc" stroke-width="2"/>
  <text x="88" y="142" fill="#003057" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Mitt mål</text>
  <text x="88" y="168" fill="#1b3a4b" font-family="Segoe UI, Arial, sans-serif" font-size="15">Jeg vil søke jobb som passer meg. Først registrerer jeg stillingene.</text>

  <!-- Kolonner -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="204" width="196" height="280" rx="12" fill="#e8f1f6" stroke="#9bb8c8"/>
    <text x="162" y="236" text-anchor="middle" fill="#003057" font-size="15" font-weight="700">Skal søke</text>
    <rect x="80" y="252" width="164" height="88" rx="10" fill="#fff" stroke="#005F73" stroke-width="2"/>
    <text x="96" y="280" fill="#003057" font-size="13" font-weight="700">Butikkmedarbeider</text>
    <text x="96" y="302" fill="#334" font-size="12">Bunnpris</text>
    <text x="96" y="324" fill="#334" font-size="12">Frist: 20.10.2026</text>
    <rect x="80" y="352" width="164" height="88" rx="10" fill="#fff" stroke="#005F73" stroke-width="2"/>
    <text x="96" y="380" fill="#003057" font-size="13" font-weight="700">Lagerarbeider</text>
    <text x="96" y="402" fill="#334" font-size="12">Posten Bring</text>
    <text x="96" y="424" fill="#334" font-size="12">Frist: 28.10.2026</text>

    <rect x="276" y="204" width="196" height="280" rx="12" fill="#eef2f5" stroke="#9bb8c8"/>
    <text x="374" y="236" text-anchor="middle" fill="#003057" font-size="15" font-weight="700">Sendt søknad</text>
    <text x="374" y="320" text-anchor="middle" fill="#667788" font-size="13">Ingen kort</text>

    <rect x="488" y="204" width="196" height="280" rx="12" fill="#eef2f5" stroke="#9bb8c8"/>
    <text x="586" y="236" text-anchor="middle" fill="#003057" font-size="15" font-weight="700">Innkalt</text>
    <text x="586" y="320" text-anchor="middle" fill="#667788" font-size="13">Ingen kort</text>

    <rect x="700" y="204" width="196" height="280" rx="12" fill="#eef2f5" stroke="#9bb8c8"/>
    <text x="798" y="236" text-anchor="middle" fill="#003057" font-size="15" font-weight="700">Avslag</text>
    <text x="798" y="320" text-anchor="middle" fill="#667788" font-size="13">Ingen kort</text>
  </g>
</svg>
